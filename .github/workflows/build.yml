name: build

# next: build and keep the module as a workflow artifact.
# main: build and publish a release Lichii's Download button picks up (releases/latest).
on:
  push:
    branches: [main, next]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build as local: the Dockerfile fetches NVIDIA's SDK files and checks them
      # against ngx_files.sha256; nothing NVIDIA is committed.
      - name: Build
        run: |
          # Made here so the runner user owns it (Docker would make it as root).
          mkdir -p out
          docker compose -f compose.yaml run --rm build
          cd out
          sha256sum lichii-dlss-module.so > lichii-dlss-module.so.sha256
          cat lichii-dlss-module.so.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichii-dlss-module
          path: out/

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\(lichii-dlss VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag="v$version"
          # Same module version as an earlier release: a date tag, so every main push publishes.
          if gh release view "$tag" > /dev/null 2>&1; then
            tag="v$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Lichii DLSS module $tag" \
            --notes "Module version $version. MIT covers this repository's source; NVIDIA's licence (NVIDIA-LICENSE.txt) covers NVIDIA's object code in lichii-dlss-module.so." \
            out/lichii-dlss-module.so out/lichii-dlss-module.so.sha256 out/LICENSE out/NVIDIA-LICENSE.txt
